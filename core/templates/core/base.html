{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Анализ{% endblock %} · BotNet Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="{% url 'engine_jobs' %}"><span class="dot"></span>botnet<span class="muted">/detector</span></a>
  <nav>
    <a href="{% url 'engine_jobs' %}">Анализ Threads</a>
    <a href="{% url 'engine_accounts' %}">CRM</a>
    <a href="{% url 'engine_groups' %}">Группы</a>
  </nav>
</header>
<main>
  {% for m in messages %}<div class="flash {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
