x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &environment
    ENGINE_API_KEY: ${ENGINE_API_KEY:?Set ENGINE_API_KEY in .env}
    ENGINE_DATABASE_URL: postgresql+psycopg://botnet:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/botnet_engine
    ENGINE_MODEL_PATH: /app/media/models/portable.joblib
    CELERY_BROKER_URL: redis://redis:6379/0
    ENGINE_API_URL: http://api:8001
    POSTGRES_DB: botnet_crm
    POSTGRES_USER: botnet
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  volumes:
    - ./media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: botnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: botnet_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-databases.sql:/docker-entrypoint-initdb.d/01-crm.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U botnet -d botnet_engine]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    ports:
      - 127.0.0.1:8001:8001
    command: uvicorn service.app:create_app --factory --host 0.0.0.0 --port 8001
  worker:
    <<: *app
    command: celery -A service.worker:celery worker --loglevel=INFO --concurrency=2
  web:
    <<: *app
    ports:
      - 127.0.0.1:8000:8000
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py runserver --noreload 0.0.0.0:8000'
volumes:
  postgres_data:
  redis_data:
